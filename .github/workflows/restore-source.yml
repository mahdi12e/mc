name: Restore project source

on:
  push:
    paths:
      - ".github/workflows/restore-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-project-source
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recover uploaded source archive from repository history
        shell: bash
        run: |
          set -euo pipefail
          git show 965ad5cdae20824b8fc8028444e8c08d4727ce58:grok-workspace.zip > /tmp/grok-workspace.zip
          mkdir -p /tmp/project-source
          unzip -q /tmp/grok-workspace.zip -d /tmp/project-source
          rsync -a \
            --exclude='.grok/' \
            --exclude='.vercel/' \
            --exclude='screenshots/' \
            --exclude='.node_modules.lock' \
            /tmp/project-source/ ./
          test -f package.json
          test -d src
          test -f vite.config.ts

      - name: Commit restored source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Restore application source files"
          git push
